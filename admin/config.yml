backend:
  name: git-gateway
  branch: main # Ensure this matches your GitHub branch

media_folder: "images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Site Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "General Settings"
        file: "js/cms-data.json"
        fields:
          - { label: "Site Name", name: "site_name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "City", name: "city", widget: "string" }
          - { label: "Logo Text", name: "logo", widget: "string" }
          - { label: "Contact Email", name: "email", widget: "string" }
          - { label: "Contact Phone", name: "phone", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }

  - name: "home"
    label: "Home Page"
    delete: false
    editor:
      preview: false
    files:
      - name: "hero"
        label: "Hero Section"
        file: "js/cms-data.json"
        fields:
          - { label: "Hero Tagline", name: "hero_tag", widget: "string" }
          - { label: "Welcome Text", name: "hero_welcome", widget: "string" }
          - { label: "Headline", name: "hero_headline", widget: "string" }
          - { label: "Description", name: "hero_description", widget: "text" }
          - label: "Hero Buttons"
            name: "hero_btns"
            widget: "object"
            fields:
              - { label: "Primary Label", name: "primary_label", widget: "string" }
              - { label: "Primary Link", name: "primary_href", widget: "string" }
              - { label: "Secondary Label", name: "secondary_label", widget: "string" }
              - { label: "Secondary Link", name: "secondary_href", widget: "string" }

  - name: "services"
    label: "Services"
    folder: "content/services"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Icon Emoji", name: "emoji", widget: "string" }
      - { label: "Gradient Color", name: "gradient", widget: "string" }
